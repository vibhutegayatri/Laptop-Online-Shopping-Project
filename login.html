<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-image: url(./images/laptopspace.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }

        .form-container {
            background-color: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: 70px auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        .button {
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            border: none;
            padding: 12px;
            border-radius: 50px;
        }

        .button:hover {
            background-color: black;
            color: white;
        }

        .reg {
            text-decoration: none;
            font-size: 15px;
        }

        .to img {
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .to img:hover {
            transform: scale(1.3);
            filter: drop-shadow(0px 0px 5px gray);
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

    </style>

    <script>
        function login(event) {
            event.preventDefault();
            alert("Username and password not matched, please check the password and username.");
            window.location.reload();
        }
    </script>
</head>

<body>

    <div class="container">
        <div class="form-container">
            <h1 class="text-center mb-4">Login</h1>

            <form onsubmit="login(event)">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-person-fill"></i> Username</label>
                    <input type="text" class="form-control" name="uname" placeholder="Your Username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lock-fill"></i> Password</label>
                    <input type="password" class="form-control" name="pass" placeholder="Your Password" required>
                </div>

                <div class="text-end mb-3">
                    <a href="#" class="small">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary button mb-3"><b>Login</b></button>

                <h6 class="text-center">
                    <a href="./reg.html" class="reg">Registration is here.</a>
                </h6>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1 border border-dark">
                    <span class="px-2">OR</span>
                    <hr class="flex-grow-1 border border-dark">
                </div>

                <p class="text-center">Sign up with</p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="#" class="to"><img width="48" height="48" src="https://img.icons8.com/fluency/48/facebook-new.png" alt="facebook"></a>
                    <a href="#" class="to"><img width="48" height="48" src="https://img.icons8.com/color/48/google-logo.png" alt="google"></a>
                    <a href="#" class="to"><img width="48" height="48" src="https://img.icons8.com/color/48/twitter-circled--v1.png" alt="twitter"></a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
