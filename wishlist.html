<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Wishlist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: Georgia, 'Times New Roman', Times, serif;
    }
    .mb-4, h4 {
       padding-top: 20px;
    text-align: center;
    font-family: cursive;
    color: rgb(220, 81, 104);
    text-shadow: 2px 8px 10px pink;
    font-size: 45px;
    }
    
     .see {
    font-size: 15px;
   
    font-family: cursive;
    color: white;
    background-color: rgb(220, 81, 104);
    /* text-shadow: 2px 8px 10px pink; */
    border: none;
    /* Remove default border */
    padding: 12px 30px;
    /* Space inside button */

    border-radius: 50px;
    /* Rounded capsule shape */
    cursor: pointer;
    /* Pointer cursor */
    /* font-weight: bold; */
    transition: tranform 0.3s ease;
    margin-bottom: 80px;

}

.see:hover {
    transform: scale(1.1);
}

.mt-4{
  text-align: center;
}
  </style>
</head>

<body class="p-4 bg-light">

  <h2 class="mb-4">Your Wishlist</h2>
  <a href="index.html" class="see" >⬅ Continue Shopping</a>

  <div class="row g-4" id="cart-items"></div>

  <div class="mt-4 text-center">
    <h4>Total: Rs. <span id="total">0</span></h4>
    <button class="see" onclick="clearWishlist()" style="width: 200px;">Clear Wishlist</button>
   
  </div>

  <script>
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    const cartItems = document.getElementById('cart-items');  // ✅ corrected
    const totalElement = document.getElementById('total');

    function displayWishlist() {
      cartItems.innerHTML = "";
      let total = 0;

      if (wishlist.length === 0) {
        cartItems.innerHTML = "<center><p>Your wishlist is empty.</p></center>";
        totalElement.textContent = "0";
        return;
      }

      wishlist.forEach((item, index) => {
        // remove non-numeric symbols from price
        let cleanPrice = parseFloat(item.price.replace(/[^0-9.]/g, ""));
        total += cleanPrice;

        let col = document.createElement("div");
        col.className = "col-md-3";

        col.innerHTML = `
          <div class="card h-100">
            <img src="${item.img}" class="card-img-top" alt="${item.name}" height="300">
            <div class="card-body text-center">
              <h5 class="card-title">${item.name}</h5>
              <p class="card-text">Price: Rs.${item.price}</p>
              <button class="btn btn-danger btn-sm" onclick="removeItem(${index})">Remove</button>
            </div>
          </div>
        `;
        cartItems.appendChild(col);
      });

      totalElement.textContent = total;
    }

    function removeItem(index) {
      wishlist.splice(index, 1);
      localStorage.setItem("wishlist", JSON.stringify(wishlist)); // ✅ corrected
      displayWishlist();
    }

    function clearWishlist() {
      wishlist = [];
      localStorage.setItem("wishlist", JSON.stringify(wishlist)); // ✅ corrected
      displayWishlist();
    }

    function checkout() {
      if (wishlist.length === 0) {
        alert("Your wishlist is empty!");
        return;
      }

      localStorage.setItem("wishlist", JSON.stringify(wishlist));
      const total = wishlist.reduce((sum, item) => sum + parseFloat(item.price.replace(/[^0-9.]/g, "")), 0);
      localStorage.setItem("total", total);

      window.location.href = "page.html"; // ✅ checkout page
    }

    displayWishlist();
  </script>
</body>
</html>
